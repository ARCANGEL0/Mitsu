[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsu"
version = "1.4.2"
description = "A terminal-native coding and security companion"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ARCANGEL0" }]
dependencies = [
  "Pillow>=10.0.0",
  "mcp>=2.3,<3",
  "rich>=13.7.0",
  "textual>=1.0.0",
]

[project.scripts]
mitsu = "mitsu.__main__:main"

[tool.setuptools]
packages = [
  "mitsu",
  "mitsu.agents",
  "mitsu.armory",
  "mitsu.config",
  "mitsu.pets",
  "mitsu.providers",
  "mitsu.search",
  "mitsu.services",
  "mitsu.tools",
  "mitsu.tui",
  "mitsu.tui.dialogs",
  "mitsu.tui.widgets",
  "mitsu.workspace",
]

[tool.setuptools.package-dir]
"mitsu" = "."
"mitsu.agents" = "agents"
"mitsu.armory" = "armory"
"mitsu.config" = "config"
"mitsu.pets" = "pets"
"mitsu.providers" = "providers"
"mitsu.search" = "search"
"mitsu.services" = "services"
"mitsu.tools" = "tools"
"mitsu.tui" = "tui"
"mitsu.tui.dialogs" = "tui/dialogs"
"mitsu.tui.widgets" = "tui/widgets"
"mitsu.workspace" = "workspace"

[tool.setuptools.package-data]
mitsu = ["assets/pets/*.webp"]
"mitsu.tui" = ["theme.tcss"]
