[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsu"
version = "0.1.0"
description = "A terminal-native coding and security companion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ARCANGEL0" }]
dependencies = [
  "Pillow>=10.0.0",
  "mcp>=2.3,<3",
  "rich>=13.7.0",
  "textual>=1.0.0",
]

[project.scripts]
mitsu = "mitsu.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mitsu*"]

[tool.setuptools.package-data]
mitsu = ["assets/companions/*.webp"]
